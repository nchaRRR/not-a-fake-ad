# Builds the iOS app and uploads it to App Store Connect (TestFlight). No Mac needed.
# Run: GitHub → Actions → "iOS (TestFlight)" → Run workflow.
# Signing: each run creates a temporary Apple Distribution certificate + App Store profile through the
# App Store Connect API (key role: Admin), signs and uploads. They stay valid while Apple processes the upload and
# are revoked by the next run (revoking right away made the upload "Invalid Binary"). No Mac, no devices needed.
# Secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID          10-character Team ID (developer.apple.com → Account → Membership details)
#   APPSTORE_KEY_ID        API key ID
#   APPSTORE_ISSUER_ID     issuer ID shown above the key list
#   APPSTORE_KEY_P8        full text of the downloaded AuthKey_XXXX.p8 file
# Version = versionName in android/app/build.gradle; build number = run number of this workflow.
name: iOS (TestFlight)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect (off = only build the .ipa)
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          miss=0
          for n in TEAM:APPLE_TEAM_ID KEY_ID:APPSTORE_KEY_ID ISSUER:APPSTORE_ISSUER_ID P8:APPSTORE_KEY_P8; do
            v="${n%%:*}"; if [ -z "${!v}" ]; then echo "::error::${n#*:} secret is missing"; miss=1; fi
          done
          exit $miss

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build the game (single-file HTML → dist/app/index.html)
        run: npm run build

      - name: Copy the game into the iOS project
        run: |
          npx cap sync ios
          echo "---- native plugins (Swift packages) ----"
          cat ios/App/CapApp-SPM/Package.swift
          echo "::notice::Swift packages: $(grep -oE 'name: \"[A-Za-z]+\"' ios/App/CapApp-SPM/Package.swift | tr '\n' ' ')"

      - name: API key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" | tr -d '\r' > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          # Shape checks only (values stay hidden), so a wrong secret is named instead of a bare 401
          ok=1
          [[ "$KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPSTORE_KEY_ID should be 10 capital letters/digits (it has ${#KEY_ID} characters)"; ok=0; }
          [[ "$ISSUER" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::APPSTORE_ISSUER_ID should look like xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx (it has ${#ISSUER} characters)"; ok=0; }
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" || { echo "::error::APPSTORE_KEY_P8 must be the whole .p8 file, from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----"; ok=0; }
          openssl pkey -in "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" -noout 2>/dev/null || { echo "::error::APPSTORE_KEY_P8 is not a readable private key (copy the .p8 file again)"; ok=0; }
          [ $ok = 1 ] || exit 1
          echo "::notice::App Store Connect key looks well-formed (Key ID ${KEY_ID:0:3}…, issuer ${ISSUER:0:4}…). A 401 after this means Key ID, Issuer ID and the .p8 file do not belong together."

      - name: Signing (temporary distribution certificate + App Store profile)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          BUNDLE_ID: com.nimoriq.notafakead
          RUN_ID: ${{ github.run_number }}
        run: |
          export APPSTORE_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$APPSTORE_KEY_ID.p8"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
          SIGN="$RUNNER_TEMP/signing"
          "$RUNNER_TEMP/venv/bin/python" scripts/asc.py setup "$SIGN"
          SHA1=$(python3 -c "import json;print(json.load(open('$SIGN/signing.json'))['sha1'])")
          PNAME=$(python3 -c "import json;print(json.load(open('$SIGN/signing.json'))['profileName'])")
          PUUID=$(python3 -c "import json;print(json.load(open('$SIGN/signing.json'))['profileUuid'])")
          # keychain with the new identity
          KC="$RUNNER_TEMP/ci.keychain-db"; KP=ci-$RANDOM$RANDOM
          /usr/bin/openssl x509 -inform der -in "$SIGN/cert.cer" -out "$SIGN/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$SIGN/key.pem" -in "$SIGN/cert.pem" -out "$SIGN/id.p12" -passout pass:$KP
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$SIGN/id.p12" -k "$KC" -P "$KP" -T /usr/bin/codesign -T /usr/bin/security
          curl -fsSL -o "$SIGN/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer && security import "$SIGN/wwdr.cer" -k "$KC" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          # profile where Xcode looks for it
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$SIGN/profile.mobileprovision" "$d/$PUUID.mobileprovision"
          done
          # app target: manual signing with that identity + profile (package targets stay unsigned)
          python3 - "$TEAM" "$SHA1" "$PNAME" <<'EOF'
          import re, sys
          team, sha1, pname = sys.argv[1:]
          p = 'ios/App/App.xcodeproj/project.pbxproj'
          s = open(p).read()
          def fix(m):
              b = m.group(0)
              if 'PRODUCT_BUNDLE_IDENTIFIER = com.nimoriq.notafakead;' not in b:
                  return b
              b = b.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
              extra = f'\n\t\t\t\tDEVELOPMENT_TEAM = {team};\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "{sha1}";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{pname}";'
              return b.replace('buildSettings = {', 'buildSettings = {' + extra, 1)
          s2 = re.sub(r'isa = XCBuildConfiguration;.*?name = \w+;', fix, s, flags=re.S)
          assert s2 != s, 'app target build settings not found'
          open(p, 'w').write(s2)
          print('signing settings applied')
          EOF
          echo "KC=$KC" >> "$GITHUB_ENV"; echo "PNAME=$PNAME" >> "$GITHUB_ENV"; echo "SHA1=$SHA1" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          VERSION=$(grep -m1 'versionName' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Version $VERSION ($GITHUB_RUN_NUMBER)"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || true
          tail -n 80 "$RUNNER_TEMP/archive.log"
          if [ ! -d "$RUNNER_TEMP/App.xcarchive" ]; then
            # surface the real reasons as annotations (visible on the run page)
            grep -E "error:|error -|fatal|No profiles|provisioning profile|Signing|signing certificate|not found|failed" "$RUNNER_TEMP/archive.log" \
              | grep -v "^note:" | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -n 12 \
              | while IFS= read -r l; do echo "::error::${l:0:800}"; done
            echo "::error::archive failed"
            exit 1
          fi

      - name: Export (and upload to App Store Connect)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          DEST=export; [ "$UPLOAD" = "true" ] && DEST=upload
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SHA1</string>
            <key>provisioningProfiles</key><dict><key>com.nimoriq.notafakead</key><string>$PNAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          # Apple's upload service sometimes drops the connection (-19235 / "Internet connection appears offline").
          # Retry those network failures; any other error stops right away.
          for attempt in 1 2 3 4; do
            rm -rf "$RUNNER_TEMP/export"
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
              -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
              -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" > "$RUNNER_TEMP/export.log" 2>&1 && rc=0 || rc=$?
            [ $rc -eq 0 ] && break
            if [ $attempt -lt 4 ] && grep -qE "did not receive a response|appears to be offline|-19235|timed out|network connection was lost|-1001|-1005|-1009" "$RUNNER_TEMP/export.log"; then
              echo "::warning::Upload attempt $attempt failed with a network error; retrying in $((attempt * 60)) s"
              tail -n 15 "$RUNNER_TEMP/export.log"
              sleep $((attempt * 60))
              continue
            fi
            break
          done
          tail -n 60 "$RUNNER_TEMP/export.log"
          # an earlier attempt may have reached Apple even though the response was lost
          if [ $rc -ne 0 ] && grep -qiE "redundant binary|already been (used|uploaded)" "$RUNNER_TEMP/export.log"; then
            echo "::notice::Apple already has this build from an earlier attempt — check TestFlight."
            rc=0
          fi
          if [ $rc -ne 0 ]; then
            grep -E "error|Error|failed|not found|denied|invalid" "$RUNNER_TEMP/export.log" | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -n 12 \
              | while IFS= read -r l; do echo "::error::${l:0:800}"; done
            exit 1
          fi
          ls -la "$RUNNER_TEMP/export" || true
          [ "$DEST" = "upload" ] && echo "::notice::Uploaded. It shows up in App Store Connect → TestFlight after Apple processes it (5–30 min)."

      - name: Revoke the temporary certificate (only if the run failed; otherwise the next run does it)
        if: failure() || cancelled()
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          export APPSTORE_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$APPSTORE_KEY_ID.p8"
          [ -x "$RUNNER_TEMP/venv/bin/python" ] && "$RUNNER_TEMP/venv/bin/python" scripts/asc.py cleanup "$RUNNER_TEMP/signing" || true
          rm -rf "$RUNNER_TEMP/signing"

      - name: Remove the temporary keychain
        if: always()
        run: |
          [ -n "$KC" ] && security delete-keychain "$KC" || true
          rm -rf "$RUNNER_TEMP/signing"

      - name: Remove the key from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - uses: actions/upload-artifact@v5
        if: ${{ !inputs.upload }}
        with:
          name: not-a-fake-ad-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
