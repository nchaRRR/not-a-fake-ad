# Builds the signed Android App Bundle (.aab) for Google Play.
# Run: GitHub → Actions → "Android (Play)" → Run workflow. The .aab is attached to the run.
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  upload keystore (.jks) as base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android (Play)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build the game (single-file HTML → dist/app/index.html)
        run: npm run build

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS:ANDROID_KEYSTORE_BASE64 KS_PASS:ANDROID_KEYSTORE_PASSWORD KEY_ALIAS:ANDROID_KEY_ALIAS KEY_PASS:ANDROID_KEY_PASSWORD; do
            n="${v%%:*}"; if [ -z "${!n}" ]; then echo "::error::${v#*:} secret is missing"; exit 1; fi
          done
          # Windows copies can carry line breaks or spaces: drop everything that is not base64
          if ! printf '%s' "$KS" | tr -cd 'A-Za-z0-9+/=' | base64 -d > android/app/upload.jks 2>/dev/null || [ ! -s android/app/upload.jks ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (paste the whole text again)"; exit 1
          fi
          # Check the password and the alias here, so the error says which one is wrong
          if ! keytool -list -keystore android/app/upload.jks -storepass "$KS_PASS" > /tmp/ks.txt 2>&1; then
            echo "::error::Keystore could not be opened: ANDROID_KEYSTORE_PASSWORD is wrong, or ANDROID_KEYSTORE_BASE64 is not the .jks file ($(head -c 200 /tmp/ks.txt | tr '\n' ' '))"; exit 1
          fi
          if ! keytool -list -keystore android/app/upload.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Alias '$KEY_ALIAS' is not in the keystore. Aliases found: $(grep -oE '^[^,]+, ' /tmp/ks.txt | tr -d ',' | tr '\n' ' ')"; exit 1
          fi
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/keystore.properties

      - name: Build the App Bundle
        working-directory: android
        env:
          # every upload needs a higher version code: run 1 → 100, run 2 → 200 …
          VERSION_CODE: ${{ github.run_number }}00
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          ls -la app/build/outputs/bundle/release/

      - name: Remove the key from the runner
        if: always()
        run: rm -f android/app/upload.jks android/keystore.properties

      - uses: actions/upload-artifact@v5
        with:
          name: not-a-fake-ad-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
